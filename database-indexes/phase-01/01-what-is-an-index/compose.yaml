name: database-index-lab
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: index_student
      POSTGRES_PASSWORD: local_lab_only
      POSTGRES_DB: index_lab
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./sql:/lab:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U index_student -d index_lab"]
      interval: 2s
      timeout: 5s
      retries: 60
volumes:
  pgdata:
